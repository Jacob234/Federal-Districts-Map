name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Verify deployment files
      run: |
        echo "Checking required files for deployment..."
        test -f index.html && echo "✓ index.html found" || echo "✗ index.html missing"
        test -f landing.html && echo "✓ landing.html found" || echo "✗ landing.html missing"

        echo ""
        echo "File sizes:"
        ls -lh index.html landing.html 2>/dev/null || true

        echo ""
        echo "Deployment will serve these HTML files from repository root"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Deployment summary
      run: |
        echo "🚀 Deployment complete!"
        echo "📍 Your site should be available at:"
        echo "   https://jacob234.github.io/Federal-Districts-Map/"
        echo ""
        echo "Note: It may take 1-2 minutes for changes to appear."
